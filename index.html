<!DOCTYPE html>
<html lang="id">
<head>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e2482f'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='white'/%3E%3C/svg%3E">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       DESIGN TOKENS & GLOBAL STYLES
       ============================================================ */
    :root {
      --bg-dark: #0d0b0a;
      --bg-surface: #161210;
      --bg-surface-elevated: #221c18;
      --bg-surface-hover: #2d2520;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.15);

      --text-main: #f8f4f0;
      --text-muted: #a3988e;
      --text-faint: #6e6358;

      --accent-primary: #e2482f;
      --accent-hover: #f0543b;
      --accent-glow: rgba(226, 72, 47, 0.35);
      --gold-accent: #e5b25d;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 24px;
      --radius-pill: 9999px;

      --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.7);
      --shadow-modal: 0 24px 60px -12px rgba(0, 0, 0, 0.9);
      --focus-ring: 0 0 0 3px var(--accent-glow);

      --font-heading: 'Space Grotesk', -apple-system, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;

      --header-height: 72px;
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-normal: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-height) + 16px);
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body.no-scroll {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    input {
      font: inherit;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    :focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
      border-radius: var(--radius-sm);
    }

    /* ============================================================
       HEADER & NAVIGATION
       ============================================================ */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      z-index: 50;
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, rgba(13, 11, 10, 0.95) 0%, rgba(13, 11, 10, 0) 100%);
      transition: background-color var(--transition-normal), backdrop-filter var(--transition-normal), border-color var(--transition-normal);
      border-bottom: 1px solid transparent;
    }

    .header.is-scrolled {
      background-color: rgba(13, 11, 10, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom-color: var(--border-subtle);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: var(--accent-primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .brand-icon svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .brand span em {
      color: var(--accent-primary);
      font-style: normal;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-right: auto;
      margin-left: 12px;
    }

    .nav-link {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: color var(--transition-fast);
      padding: 6px 0;
    }

    .nav-link:hover {
      color: var(--text-main);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      width: 260px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 8px 16px;
      transition: all var(--transition-fast);
    }

    .search-box:focus-within {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
      width: 300px;
      background: var(--bg-surface-hover);
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-right: 10px;
    }

    .search-input {
      width: 100%;
      background: none;
      border: none;
      font-size: 0.88rem;
    }

    .search-input::placeholder {
      color: var(--text-faint);
    }

    /* ============================================================
       HERO BANNER
       ============================================================ */
    .hero {
      position: relative;
      min-height: clamp(520px, 75vh, 700px);
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      margin-top: 0;
    }

    body.no-hero .hero {
      display: none;
    }

    .hero-backdrop {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 25%;
      transform: scale(1.03);
      filter: brightness(0.85);
      transition: background-image 0.5s ease;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(0deg, var(--bg-dark) 2%, rgba(13, 11, 10, 0.6) 50%, rgba(13, 11, 10, 0.2) 100%),
        linear-gradient(90deg, var(--bg-dark) 0%, rgba(13, 11, 10, 0.7) 45%, transparent 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding-top: calc(var(--header-height) + 40px);
      padding-bottom: 60px;
      max-width: 640px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(229, 178, 93, 0.15);
      border: 1px solid rgba(229, 178, 93, 0.3);
      color: var(--gold-accent);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 16px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .hero-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
    }

    .hero-desc {
      font-size: 0.98rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-play {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--accent-primary);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px var(--accent-glow);
      transition: all var(--transition-fast);
    }

    .btn-play:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(226, 72, 47, 0.5);
    }

    .btn-play svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ============================================================
       CATALOG & FILTERS
       ============================================================ */
    .catalog {
      padding: 50px 0 80px;
      flex: 1;
    }

    body.no-hero .catalog {
      padding-top: calc(var(--header-height) + 40px);
    }

    .catalog-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
    }

    .catalog-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .catalog-count {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-faint);
    }

    .chips-wrapper {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 28px;
      scrollbar-width: none;
    }

    .chips-wrapper::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      white-space: nowrap;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-pill);
      background: var(--bg-surface-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      transition: all var(--transition-fast);
    }

    .chip-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
      border-color: var(--border-medium);
    }

    .chip-btn.active {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px 18px;
    }

    .movie-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      position: relative;
      border-radius: var(--radius-md);
    }

    .card-poster-box {
      position: relative;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-surface-elevated);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-subtle);
      transition: transform var(--transition-normal), border-color var(--transition-normal), box-shadow var(--transition-normal);
    }

    .movie-card:hover .card-poster-box {
      transform: translateY(-6px);
      border-color: var(--border-medium);
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-glow);
    }

    .card-poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-normal);
    }

    .movie-card:hover .card-poster-img {
      transform: scale(1.06);
    }

    .card-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 11, 10, 0.45);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .movie-card:hover .card-play-overlay {
      opacity: 1;
    }

    .card-play-btn {
      width: 52px;
      height: 52px;
      background: var(--accent-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      transform: scale(0.85);
      transition: transform var(--transition-fast);
    }

    .movie-card:hover .card-play-btn {
      transform: scale(1);
    }

    .card-play-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      margin-left: 2px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .card-genre-badge {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
    }

    .card-year-badge {
      color: var(--gold-accent);
    }

    /* Poster Fallback Text */
    .poster-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      background: linear-gradient(135deg, var(--bg-surface-elevated), var(--bg-surface));
    }

    /* Skeleton Loading State */
    .skeleton-card {
      aspect-ratio: 2 / 3;
      border-radius: var(--radius-md);
      background: linear-gradient(90deg, var(--bg-surface-elevated) 25%, var(--bg-surface-hover) 50%, var(--bg-surface-elevated) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 70px 20px;
      max-width: 420px;
      margin: 0 auto;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: var(--bg-surface-elevated);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
    }

    .empty-title {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-reset {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-main);
      transition: all var(--transition-fast);
    }

    .btn-reset:hover {
      background: var(--bg-surface-hover);
      border-color: var(--accent-primary);
    }

    /* ============================================================
       VIDEO PLAYER MODAL & DRIVE PROTECTION CONTAINER
       ============================================================ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(8, 6, 5, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition-normal);
    }

    .modal-backdrop.is-open {
      opacity: 1;
      visibility: visible;
    }

    .modal-container {
      position: relative;
      width: min(1000px, 100%);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      overflow: hidden;
      transform: scale(0.95);
      transition: transform var(--transition-normal);
    }

    .modal-backdrop.is-open .modal-container {
      transform: scale(1);
    }

    .player-aspect-box {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .player-host-view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .player-host-view iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* CRITICAL PROTECTION: Google Drive Top Mask Overlay Bar */
    .drive-shield-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: linear-gradient(180deg, rgba(13, 11, 10, 0.98) 0%, rgba(13, 11, 10, 0.8) 70%, transparent 100%);
      z-index: 25;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      user-select: none;
    }

    .drive-shield-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold-accent);
      background: rgba(229, 178, 93, 0.12);
      border: 1px solid rgba(229, 178, 93, 0.25);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
    }

    .drive-shield-badge svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 30;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(13, 11, 10, 0.7);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      transition: all var(--transition-fast);
    }

    .modal-close-btn:hover {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      transform: rotate(90deg);
    }

    .modal-close-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    /* YouTube Custom Overlay Controls */
    .player-surface-trigger {
      position: absolute;
      inset: 0;
      z-index: 5;
      cursor: pointer;
    }

    .player-cover-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-cover-layer::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(13, 11, 10, 0.6);
    }

    .cover-play-btn {
      position: relative;
      z-index: 2;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px var(--accent-glow);
      transition: transform var(--transition-fast), background var(--transition-fast);
    }

    .cover-play-btn:hover {
      transform: scale(1.1);
      background: var(--accent-hover);
    }

    .cover-play-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .cover-spinner {
      position: relative;
      z-index: 2;
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .player-controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: linear-gradient(0deg, rgba(13, 11, 10, 0.95) 0%, transparent 100%);
      opacity: 0;
      transform: translateY(10px);
      transition: all var(--transition-fast);
    }

    .player-aspect-box:hover .player-controls-bar,
    .player-aspect-box:focus-within .player-controls-bar {
      opacity: 1;
      transform: translateY(0);
    }

    .ctrl-btn {
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast);
    }

    .ctrl-btn:hover {
      color: var(--accent-primary);
    }

    .ctrl-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .seek-slider, .vol-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, var(--accent-primary) var(--progress, 0%), rgba(255, 255, 255, 0.25) 0%);
      cursor: pointer;
    }

    .seek-slider { flex: 1; }
    .vol-slider { width: 70px; }

    .seek-slider::-webkit-slider-thumb, .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    .time-display {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .modal-details {
      padding: 24px;
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .modal-meta-info {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-accent);
      margin-bottom: 12px;
    }

    .modal-description {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .player-error-state {
      position: absolute;
      inset: 0;
      z-index: 15;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    .footer {
      border-top: 1px solid var(--border-subtle);
      padding: 28px 0;
      background: var(--bg-dark);
      margin-top: auto;
    }

    .footer-text {
      font-size: 0.85rem;
      color: var(--text-faint);
      text-align: center;
    }

    /* ============================================================
       RESPONSIVE BREAKPOINTS
       ============================================================ */
    @media (max-width: 768px) {
      :root {
        --header-height: 64px;
      }

      .nav-menu {
        display: none;
      }

      .search-box, .search-box:focus-within {
        width: 100%;
        max-width: 220px;
      }

      .hero {
        min-height: auto;
      }

      .hero-content {
        padding-top: calc(var(--header-height) + 20px);
        padding-bottom: 40px;
      }

      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px 12px;
      }

      .vol-slider {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 0 16px;
      }

      .brand span {
        font-size: 1.1rem;
      }

      .search-box {
        padding: 6px 12px;
      }

      }

        width: 100%;

        padding: 0;
      }

      }

  </style>

  <!-- MAIN CATALOG -->

          </div>

  <!-- PLAYER MODAL -->
  <div class="modal-backdrop" id="playerModal" role="dialog" aria-modal="true" aria-hidden="true">

        <!-- Drive Shield Overlay Bar (Proteksi Tombol Pop-Out Drive) -->

            Gemorca Secure Stream
          </div>

        <!-- Cover & Trigger YouTube -->
        <div class="player-surface-trigger" id="playerSurface" hidden></div>
        <div class="player-cover-layer" id="playerCover" hidden>

        <!-- Custom Controls untuk YouTube API -->
        <div class="player-controls-bar" id="youtubeControls" hidden>
          <button type="button" class="ctrl-btn" id="btnPlayPause" aria-label="Putar">

          <button type="button" class="ctrl-btn" id="btnMute" aria-label="Suara">
            <svg id="iconVol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <svg id="iconMuted" viewBox="0 0 24 24" hidden><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input type="range" class="vol-slider" id="volumeBar" min="0" max="100" value="100" aria-label="Volume">
          <button type="button" class="ctrl-btn" id="btnFullscreen" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>

      <div class="modal-details">
        <h3 class="modal-title" id="modalTitle"></h3>
        <p class="modal-meta-info" id="modalMeta"></p>
        <p class="modal-description" id="modalDesc"></p>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    (function () {
      "use strict";

      const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5dCln-zDV_zKmTvNwaNrttTBQaRjGPs5W6KjovG2_HZYjgYKciJrOcJv5jXBl6bfkOl_SSbi3cvs5/pub?gid=0&single=true&output=csv";
      const ALL_GENRES = "Semua";
      const TITLE_CACHE_PREFIX = "gemorca_title_";
      const YT_STATE = { ENDED: 0, PLAYING: 1, PAUSED: 2, BUFFERING: 3 };

      const $ = (sel) => document.querySelector(sel);

      const els = {
        header: $("#mainHeader"),
        hero: $("#top"),
        heroBackdrop: $("#heroBackdrop"),
        heroTitle: $("#heroTitle"),
        heroTags: $("#heroTags"),
        heroDesc: $("#heroDesc"),
        heroPlayBtn: $("#heroPlayBtn"),
        catalogHeading: $("#catalogHeading"),
        resultCounter: $("#resultCounter"),
        chipsBox: $("#genreFilterChips"),
        movieGrid: $("#movieGrid"),
        emptyState: $("#emptyState"),
        emptyTitle: $("#emptyTitle"),
        emptyDesc: $("#emptyDesc"),
        resetBtn: $("#resetFilterBtn"),
        searchInput: $("#searchInput"),
        modal: $("#playerModal"),
        modalCloseBtn: $("#modalCloseBtn"),
        modalTitle: $("#modalTitle"),
        modalMeta: $("#modalMeta"),
        modalDesc: $("#modalDesc"),
        playerHost: $("#playerHost"),
        driveShieldBar: $("#driveShieldBar"),
        playerSurface: $("#playerSurface"),
        playerCover: $("#playerCover"),
        coverSpinner: $("#coverSpinner"),
        coverPlayBtn: $("#coverPlayBtn"),
        youtubeControls: $("#youtubeControls"),
        btnPlayPause: $("#btnPlayPause"),
        iconPlay: $("#iconPlay"),
        iconPause: $("#iconPause"),
        seekBar: $("#seekBar"),
        timeLabel: $("#timeLabel"),
        btnMute: $("#btnMute"),
        iconVol: $("#iconVol"),
        iconMuted: $("#iconMuted"),
        volumeBar: $("#volumeBar"),
        btnFullscreen: $("#btnFullscreen"),
        playerError: $("#playerError"),
        currentYear: $("#currentYear")
      };

      let FILMS = [];
      const state = { query: "", genre: ALL_GENRES, isError: false };
      const player = { yt: null, session: 0, ready: false, seeking: false, interval: null, film: null };
      let lastFocusedEl = null;
      let ytApiPromise = null;

      // Helper Functions
      function splitGenre(text) {
        return String(text || "").split(",").map(s => s.trim()).filter(Boolean);
      }

      function formatTime(seconds) {
        const total = Math.max(0, Math.floor(seconds || 0));
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = String(total % 60).padStart(2, "0");
        return h > 0 ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
      }

      // Extract YouTube ID
      function parseYouTubeId(urlStr) {
        try {
          const u = new URL(String(urlStr).trim());
          const host = u.hostname.replace(/^(www|m)\./, "");
          if (host === "youtu.be") return u.pathname.slice(1);
          if (host === "youtube.com" || host === "youtube-nocookie.com") {
            if (u.pathname === "/watch") return u.searchParams.get("v");
            const m = u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/);
            if (m) return m[1];
          }
        } catch (e) {}
        return "";
      }

      // Extract Google Drive ID
      function parseDriveId(urlStr) {
        try {
          const u = new URL(String(urlStr).trim());
          if (u.hostname.includes("drive.google.com")) {
            const matchPath = u.pathname.match(/\/file\/d\/([^\/]+)/);
            if (matchPath && matchPath[1]) return matchPath[1];
            const idParam = u.searchParams.get("id");
            if (idParam) return idParam;
          }
        } catch (e) {}
        return "";
      }

      // Build Google Drive Preview Embed URL
      function getDriveEmbedUrl(urlStr) {
        const driveId = parseDriveId(urlStr);
        if (driveId) {
          return `https://drive.google.com/file/d/${driveId}/preview`;
        }
        return urlStr;
      }

      // Parse CSV Data
      function parseCSV(text) {
        const rows = [];
        let row = [], field = "", inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (inQuotes) {
            if (ch === '"') {
              if (text[i + 1] === '"') { field += '"'; i++; }
              else { inQuotes = false; }
            } else { field += ch; }
          } else if (ch === '"') { inQuotes = true; }
          else if (ch === ",") { row.push(field); field = ""; }
          else if (ch === "\n" || ch === "\r") {
            if (ch === "\r" && text[i + 1] === "\n") i++;
            row.push(field); rows.push(row); row = []; field = "";
          } else { field += ch; }
        }
        if (field !== "" || row.length) { row.push(field); rows.push(row); }
        return rows;
      }

      function convertRowsToFilms(rows) {
        if (rows.length < 2) return [];
        const head = rows[0].map(h => h.trim().toLowerCase());
        const findCol = (keys) => head.findIndex(h => keys.includes(h));

        const cols = {
          video: findCol(["video", "link", "url", "videourl"]),
          judul: findCol(["judul", "title"]),
          genre: findCol(["genre"]),
          tahun: findCol(["tahun", "year"]),
          poster: findCol(["poster", "posterurl"]),
          deskripsi: findCol(["deskripsi", "sinopsis"]),
          unggulan: findCol(["unggulan", "featured"])
        };

        const cell = (r, k) => (cols[k] >= 0 ? (r[cols[k]] || "").trim() : "");

        return rows.slice(1).map((r, i) => {
          const video = cell(r, "video");
          if (!video) return null;

          const ytId = parseYouTubeId(video);
          const poster = cell(r, "poster");
          const isFeatured = ["ya", "yes", "true", "1"].includes(cell(r, "unggulan").toLowerCase());

          return {
            id: i + 1,
            judul: cell(r, "judul"),
            genre: cell(r, "genre"),
            tahun: cell(r, "tahun"),
            posterUrl: poster || (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : ""),
            videoUrl: video,
            deskripsi: cell(r, "deskripsi"),
            unggulan: isFeatured
          };
        }).filter(Boolean);
      }

      async function loadData() {
        renderSkeletonGrid();
        try {
          const res = await fetch(SHEET_CSV_URL);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const rawText = (await res.text()).replace(/^\uFEFF/, "");
          FILMS = convertRowsToFilms(parseCSV(rawText));
          await autoFillMissingTitles();
        } catch (err) {
          state.isError = true;
          console.error("Gagal memuat CSV Google Sheet:", err);
        }
        renderHero();
        renderFilterChips();
        renderMovieGrid();
      }

      async function autoFillMissingTitles() {
        await Promise.all(FILMS.map(async (f) => {
          if (f.judul) return;
          const ytId = parseYouTubeId(f.videoUrl);
          if (ytId) {
            let cached = localStorage.getItem(TITLE_CACHE_PREFIX + ytId);
            if (!cached) {
              try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${ytId}`);
                const data = await res.json();
                if (data && data.title) {
                  cached = data.title;
                  localStorage.setItem(TITLE_CACHE_PREFIX + ytId, cached);
                }
              } catch (e) {}
            }
            f.judul = cached || `Film ${f.id}`;
          } else {
            f.judul = `Film ${f.id}`;
          }
        }));
      }

      // Render Skeleton Loading
      function renderSkeletonGrid() {
        els.movieGrid.innerHTML = Array(8).fill('<div class="skeleton-card"></div>').join("");
      }

      // Render Hero Banner
      function renderHero() {
        const featured = FILMS.find(f => f.unggulan) || FILMS[0];
        if (!featured) {
          els.hero.hidden = true;
          document.body.classList.add("no-hero");
          return;
        }
        els.hero.hidden = false;
        document.body.classList.remove("no-hero");

        els.heroTitle.textContent = featured.judul;
        els.heroDesc.textContent = featured.deskripsi || "Saksikan film menarik ini secara gratis langsung melalui browser Anda.";
        
        els.heroTags.innerHTML = "";
        splitGenre(featured.genre).forEach(g => {
          const span = document.createElement("span");
          span.className = "hero-tag";
          span.textContent = g;
          els.heroTags.appendChild(span);
        });

        if (featured.posterUrl) {
          els.heroBackdrop.style.backgroundImage = `url(${featured.posterUrl})`;
        }
        els.heroPlayBtn.onclick = () => openPlayerModal(featured);
      }

      // Render Filter Chips
      function renderFilterChips() {
        const genres = [ALL_GENRES, ...new Set(FILMS.flatMap(f => splitGenre(f.genre)))];
        els.chipsBox.innerHTML = "";
        genres.forEach(g => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `chip-btn ${g === state.genre ? 'active' : ''}`;
          btn.textContent = g;
          btn.onclick = () => {
            state.genre = g;
            renderFilterChips();
            renderMovieGrid();
          };
          els.chipsBox.appendChild(btn);
        });
      }

      // Filtered Movie List
      function getFilteredFilms() {
        const q = state.query.trim().toLowerCase();
        return FILMS.filter(f => {
          const matchGenre = state.genre === ALL_GENRES || splitGenre(f.genre).includes(state.genre);
          const haystack = `${f.judul} ${f.genre} ${f.tahun || ''}`.toLowerCase();
          return matchGenre && (!q || haystack.includes(q));
        });
      }

      // Render Movie Grid
      function renderMovieGrid() {
        const filtered = getFilteredFilms();
        els.movieGrid.innerHTML = "";

        if (filtered.length === 0) {
          els.movieGrid.hidden = true;
          els.emptyState.hidden = false;
          if (FILMS.length === 0 && state.isError) {
            els.emptyTitle.textContent = "Gagal Memuat Film";
            els.emptyDesc.textContent = "Terjadi masalah koneksi saat mengambil data dari Google Sheet. Coba muat ulang halaman.";
          } else if (FILMS.length === 0) {
            els.emptyTitle.textContent = "Katalog Masih Kosong";
            els.emptyDesc.textContent = "Belum ada film yang ditambahkan di Google Sheet.";
          } else {
            els.emptyTitle.textContent = "Film Tidak Ditemukan";
            els.emptyDesc.textContent = "Coba gunakan kata kunci pencarian lain atau pilih genre berbeda.";
          }
          els.resultCounter.textContent = "0 film";
          return;
        }

        els.movieGrid.hidden = false;
        els.emptyState.hidden = true;
        els.resultCounter.textContent = `${filtered.length} film tersedia`;

        filtered.forEach(film => {
          const card = document.createElement("div");
          card.className = "movie-card";
          card.onclick = () => openPlayerModal(film);

          const posterBox = document.createElement("div");
          posterBox.className = "card-poster-box";

          if (film.posterUrl) {
            const img = document.createElement("img");
            img.className = "card-poster-img";
            img.src = film.posterUrl;
            img.alt = film.judul;
            img.loading = "lazy";
            img.onerror = () => {
              img.remove();
              posterBox.appendChild(createPosterFallback(film.judul));
            };
            posterBox.appendChild(img);
          } else {
            posterBox.appendChild(createPosterFallback(film.judul));
          }

          const overlay = document.createElement("div");
          overlay.className = "card-play-overlay";
          overlay.innerHTML = '<div class="card-play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>';
          posterBox.appendChild(overlay);

          const title = document.createElement("div");
          title.className = "card-title";
          title.textContent = film.judul;

          const meta = document.createElement("div");
          meta.className = "card-meta-bar";
          const genreBadge = document.createElement("span");
          genreBadge.className = "card-genre-badge";
          genreBadge.textContent = splitGenre(film.genre)[0] || "Film";
          const yearBadge = document.createElement("span");
          yearBadge.className = "card-year-badge";
          yearBadge.textContent = film.tahun || "";

          meta.append(genreBadge, yearBadge);
          card.append(posterBox, title, meta);
          els.movieGrid.appendChild(card);
        });
      }

      function createPosterFallback(title) {
        const fallback = document.createElement("div");
        fallback.className = "poster-fallback";
        fallback.textContent = title;
        return fallback;
      }

      // YouTube API Dynamic Loader
      function loadYouTubeApi() {
        if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
        if (!ytApiPromise) {
          ytApiPromise = new Promise((resolve) => {
            window.onYouTubeIframeAPIReady = () => resolve(window.YT);
            const tag = document.createElement("script");
            tag.src = "https://www.youtube.com/iframe_api";
            document.head.appendChild(tag);
          });
        }
        return ytApiPromise;
      }

      // Teardown Video Player
      function teardownPlayer() {
        player.session += 1;
        clearInterval(player.interval);
        if (player.yt && typeof player.yt.destroy === "function") {
          try { player.yt.destroy(); } catch (e) {}
        }
        player.yt = null;
        player.ready = false;
        player.film = null;

        els.playerHost.innerHTML = "";
        els.driveShieldBar.hidden = true;
        els.youtubeControls.hidden = true;
        els.playerCover.hidden = true;
        els.playerSurface.hidden = true;
        els.playerError.hidden = true;
      }

      // Open Player Modal
      async function openPlayerModal(film) {
        lastFocusedEl = document.activeElement;
        teardownPlayer();
        player.film = film;

        els.modalTitle.textContent = film.judul;
        els.modalDesc.textContent = film.deskripsi || "Tidak ada deskripsi tambahan untuk film ini.";
        els.modalMeta.textContent = [film.genre, film.tahun].filter(Boolean).join(" • ");

        els.modal.classList.add("is-open");
        els.modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("no-scroll");

        const ytId = parseYouTubeId(film.videoUrl);
        const driveId = parseDriveId(film.videoUrl);

        if (ytId) {
          // Putar via YouTube Custom Player
          startYouTubePlayer(ytId, player.session);
        } else if (driveId || film.videoUrl) {
          // Putar via Protected Google Drive / Generic Embed Container
          startDrivePlayer(film.videoUrl);
        } else {
          showPlayerError("Format video tidak valid.");
        }
      }

      function startDrivePlayer(rawUrl) {
        const embedUrl = getDriveEmbedUrl(rawUrl);
        
        // Tampilkan Shield Bar untuk menutup tombol pop-out/buka di Drive
        els.driveShieldBar.hidden = false;

        const iframe = document.createElement("iframe");
        iframe.src = embedUrl;
        iframe.title = "Pemutar Video Gemorca";
        iframe.allow = "autoplay; fullscreen";
        iframe.allowFullscreen = true;

        els.playerHost.appendChild(iframe);
      }

      async function startYouTubePlayer(ytId, session) {
        els.playerCover.hidden = false;
        els.coverSpinner.hidden = false;
        els.coverPlayBtn.hidden = true;

        const api = await loadYouTubeApi();
        if (session !== player.session) return;

        els.youtubeControls.hidden = false;
        els.playerSurface.hidden = false;

        const target = document.createElement("div");
        els.playerHost.appendChild(target);

        player.yt = new api.Player(target, {
          videoId: ytId,
          playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            rel: 0,
            modestbranding: 1
          },
          events: {
            onReady: () => {
              if (session !== player.session) return;
              player.ready = true;
              els.playerCover.hidden = true;
              player.yt.playVideo();
              player.interval = setInterval(updateProgress, 300);
            },
            onStateChange: (e) => {
              if (session !== player.session) return;
              if (e.data === YT_STATE.PLAYING) {
                els.playerCover.hidden = true;
                els.iconPlay.hidden = true;
                els.iconPause.hidden = false;
              } else if (e.data === YT_STATE.PAUSED || e.data === YT_STATE.ENDED) {
                els.iconPlay.hidden = false;
                els.iconPause.hidden = true;
              }
            },
            onError: () => {
              showPlayerError("Video YouTube tidak dapat diputar.");
            }
          }
        });
      }

      function showPlayerError(msg) {
        els.playerError.textContent = msg;
        els.playerError.hidden = false;
        els.playerCover.hidden = true;
      }

      function updateProgress() {
        if (!player.ready || player.seeking) return;
        const current = player.yt.getCurrentTime() || 0;
        const duration = player.yt.getDuration() || 0;
        const pct = duration > 0 ? (current / duration) * 100 : 0;
        els.seekBar.value = Math.round(pct * 10);
        els.seekBar.style.setProperty("--progress", `${pct}%`);
        els.timeLabel.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
      }

      function closeModal() {
        if (!els.modal.classList.contains("is-open")) return;
        teardownPlayer();
        els.modal.classList.remove("is-open");
        els.modal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("no-scroll");
        if (lastFocusedEl) lastFocusedEl.focus();
      }

      // Event Listeners Integration
      els.searchInput.addEventListener("input", (e) => {
        state.query = e.target.value;
        renderMovieGrid();
      });

      els.resetBtn.addEventListener("click", () => {
        state.query = "";
        state.genre = ALL_GENRES;
        els.searchInput.value = "";
        renderFilterChips();
        renderMovieGrid();
      });

      $("#brandLink").addEventListener("click", (e) => {
        e.preventDefault();
        state.query = "";
        state.genre = ALL_GENRES;
        els.searchInput.value = "";
        renderFilterChips();
        renderMovieGrid();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      els.modalCloseBtn.addEventListener("click", closeModal);
      els.modal.addEventListener("click", (e) => {
        if (e.target === els.modal) closeModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      // YouTube Controls Trigger
      els.btnPlayPause.addEventListener("click", () => {
        if (!player.ready) return;
        const st = player.yt.getPlayerState();
        if (st === YT_STATE.PLAYING) player.yt.pauseVideo();
        else player.yt.playVideo();
      });

      els.playerSurface.addEventListener("click", () => {
        if (!player.ready) return;
        const st = player.yt.getPlayerState();
        if (st === YT_STATE.PLAYING) player.yt.pauseVideo();
        else player.yt.playVideo();
      });

      els.seekBar.addEventListener("input", () => {
        player.seeking = true;
        const pct = Number(els.seekBar.value) / 10;
        els.seekBar.style.setProperty("--progress", `${pct}%`);
      });

      els.seekBar.addEventListener("change", () => {
        if (player.ready) {
          const duration = player.yt.getDuration() || 0;
          player.yt.seekTo((duration * Number(els.seekBar.value)) / 1000, true);
        }
        player.seeking = false;
      });

      els.btnMute.addEventListener("click", () => {
        if (!player.ready) return;
        if (player.yt.isMuted()) {
          player.yt.unMute();
          els.iconVol.hidden = false;
          els.iconMuted.hidden = true;
        } else {
          player.yt.mute();
          els.iconVol.hidden = true;
          els.iconMuted.hidden = false;
        }
      });

      els.volumeBar.addEventListener("input", (e) => {
        if (!player.ready) return;
        const vol = Number(e.target.value);
        player.yt.setVolume(vol);
        if (vol === 0) {
          els.iconVol.hidden = true;
          els.iconMuted.hidden = false;
        } else {
          els.iconVol.hidden = false;
          els.iconMuted.hidden = true;
        }
      });

      els.btnFullscreen.addEventListener("click", () => {
        const playerBox = $("#playerContainer");
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else if (playerBox.requestFullscreen) {
          playerBox.requestFullscreen();
        }
      });

      window.addEventListener("scroll", () => {
        els.header.classList.toggle("is-scrolled", window.scrollY > 20);
      }, { passive: true });

      // Initialize Application
      function init() {
        els.currentYear.textContent = new Date().getFullYear();
        loadData();
      }

      init();
    })();
  </script>
</body>
</html>
